<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <meta name="description" content="VertexFlow - A high-performance, collaborative workspace powered by AI and real-time synchronization." />
    <meta name="keywords" content="collaboration, productivity, editor, real-time, AI, workflow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VertexFlow - Collaborative Workspace" />
    <meta property="og:description" content="Seamless real-time collaboration with AI-powered document intelligence." />
    <meta property="og:image" content="/og-image.png" />

    <title>VertexFlow - Collaborative Workspace</title>

    <!-- 🚀 PERFORMANCE: Preconnect only to critical 3rd-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      🚀 PERFORMANCE: Non-blocking font load (avoids render-blocking)
      media="print" trick: starts download immediately but won't block rendering;
      onload swaps to "all" once downloaded.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- ⚡ CRITICAL CSS: Inline the above-the-fold styles to eliminate FOUC -->
    <style>
      /* Design Tokens */
      :root {
        --bg-primary: #050508;
        --bg-secondary: #0d0d14;
        --bg-tertiary: #161622;
        --accent-primary: #6366f1;
        --accent-secondary: #8b5cf6;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --radius-md: 14px;
        --radius-lg: 24px;
        --transition-normal: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        --glass-border: rgba(255, 255, 255, 0.08);
        --border-color: rgba(255, 255, 255, 0.06);
      }

      /* Critical base styles */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { font-size: 16px; }

      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: var(--bg-primary);
        background-image:
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.10) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        background-attachment: scroll;
        color: var(--text-primary);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* Prevent layout shift – root fills viewport immediately */
      #root { min-height: 100vh; }

      /* Loader placeholder shown while JS initializes */
      .app-init-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary);
        z-index: 9999;
      }
      .app-init-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Inline loading placeholder — removed by React on first render -->
    <div id="root">
      <div class="app-init-loader" aria-label="Loading VertexFlow…" role="status">
        <div class="app-init-spinner"></div>
      </div>
    </div>

    <!--
      🚀 type="module" is already deferred by spec — no need for defer/async.
      Vite replaces this with the compiled entry during build.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
